[package]
name = "greetd"
version = "0.10.3"
authors = ["Kenny Levinsen"]
edition = "2018"
license = "GPL-3.0-only"
homepage = "https://kl.wtf/projects/greetd"
repository = "https://git.sr.ht/~kennylevinsen/greetd/"

[features]
debug = []
test-support = []

[dependencies]
nix = { version = "0.28", features = ["ioctl", "signal", "user", "fs", "mman"] }
pam-sys = "0.5.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
greetd_ipc = { path = "../greetd_ipc", features = ["tokio-codec"] }
inish = { path = "../inish" }
libc = "0.2"
tokio = { version = "1.54.1", features = ["net", "sync", "macros", "signal", "rt", "io-util", "time"] }
getopts = "0.2"
thiserror = "1.0"
async-trait = "0.1"
enquote = "1.1"
shlex = "1.3"
lib-multiseatd = { git = "https://github.com/shaitan-machine1/multiseatd.git", tag = "v0.4.1" }
lib-sessiond = { git = "https://github.com/shaitan-machine1/sessiond.git", rev = "27ef72702556cf1018888eac25aaf655a6efd743" }
dbus = "0.9.12"
